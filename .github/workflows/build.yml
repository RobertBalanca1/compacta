name: Construir instaladores

# Que hace este flujo (todo en la nube de GitHub, gratis; no hace falta un Mac):
#   1. Construye DOS instaladores de Mac, cada uno UN solo .dmg universal (sirve para Mac Intel y Apple Silicon):
#        - Compacta-X.Y.Z-Mac.dmg          -> macOS 13 (Ventura) o superior, con el MISMO motor que Windows (Electron actual).
#        - Compacta-X.Y.Z-Mac-antiguo.dmg  -> macOS 10.13 a 12 (y tambien funciona en los nuevos), con Electron 26.
#      Mismo codigo y misma interfaz; solo cambia el motor por debajo (ver DOCUMENTACION-PROYECTO.md 7.25).
#   2. Los PRUEBA en Macs reales de las dos arquitecturas: abre cada instalador, comprueba que lleva las dos, que la firma
#      es valida, que la ventana arranca, y comprime de verdad una foto, un HEIC, un video y un audio con lo que lleva dentro.
#   3. Pasa las pruebas del proyecto en esos mismos Macs reales.
#   4. Construye el instalador de Windows.
#   5. Si lo lanzas con una etiqueta (v1.2.2...), lo publica en «Releases» con enlace de descarga.
#
# Como se lanza a mano: pestaña «Actions» > «Construir instaladores» > «Run workflow». El resultado queda en «Artifacts».

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # solo para publicar el Release cuando se lanza con una etiqueta

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ 1. Los instaladores de Mac
  build-mac:
    name: Instalador de Mac ${{ matrix.variante }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variante: moderno
            script: dist:mac
            artefacto: Compacta-Mac
          - variante: antiguo
            script: dist:mac-legacy
            artefacto: Compacta-Mac-antiguo
    # Se construye en un Mac INTEL a proposito: en Apple Silicon, versiones anteriores de electron-builder fabricaban el .dmg en
    # formato APFS, el mas arriesgado de abrir en macOS 10.13/10.14. En Intel usa HFS+ (que lee cualquier macOS) y ademas se
    # pide HFS+ de forma explicita en package.json. Cada .dmg sale igualmente universal (Intel + Apple Silicon).
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Compilar el instalador universal (Intel + Apple Silicon)
        run: npm run ${{ matrix.script }}

      - name: Comprobar que sale UN solo .dmg
        run: |
          ls -la dist
          count=$(ls dist/*.dmg | wc -l | tr -d ' ')
          if [ "$count" != "1" ]; then echo "Se esperaba exactamente un .dmg y hay $count"; exit 1; fi
          ls dist/*.zip 2>/dev/null && { echo "No debe haber .zip de Mac"; exit 1; } || true

      - name: Guardar el instalador
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artefacto }}
          path: dist/*.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------ 2. Probar el .dmg en Macs reales
  verify-mac:
    name: Probar el .dmg ${{ matrix.variante }} en ${{ matrix.os == 'macos-latest' && 'Mac Apple Silicon' || 'Mac Intel' }}
    needs: build-mac
    strategy:
      fail-fast: false
      matrix:
        variante: [moderno, antiguo]
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ARTEFACTO: ${{ matrix.variante == 'moderno' && 'Compacta-Mac' || 'Compacta-Mac-antiguo' }}
      MINIMO: ${{ matrix.variante == 'moderno' && '13.0.0' || '10.13.0' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTEFACTO }}
          path: installer

      - name: Datos del Mac de prueba
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string || true

      - name: Abrir el .dmg y copiar la app (como haria una persona)
        run: |
          set -euo pipefail
          DMG=$(ls installer/*.dmg)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          ls -la "$RUNNER_TEMP/dmg"
          # El volumen del .dmg debe ser HFS+ (lo lee cualquier macOS, incluidos 10.13 y 10.14), no APFS.
          diskutil info "$RUNNER_TEMP/dmg" | grep -E "File System Personality|Type \(Bundle\)" || true
          diskutil info "$RUNNER_TEMP/dmg" | grep "File System Personality" | grep -q "HFS" || { echo "El .dmg no es HFS+"; exit 1; }
          mkdir -p "$RUNNER_TEMP/Applications"
          ditto "$RUNNER_TEMP/dmg/Compacta.app" "$RUNNER_TEMP/Applications/Compacta.app"
          hdiutil detach "$RUNNER_TEMP/dmg" || { sleep 3; hdiutil detach -force "$RUNNER_TEMP/dmg"; }
          echo "APP=$RUNNER_TEMP/Applications/Compacta.app" >> "$GITHUB_ENV"

      - name: Un solo programa para las dos arquitecturas, y macOS minimo
        run: |
          set -euo pipefail
          echo "Ejecutable:   $(lipo -archs "$APP/Contents/MacOS/Compacta")"
          echo "ffmpeg:       $(lipo -archs "$APP/Contents/Resources/ffmpeg/ffmpeg")"
          for f in "$APP/Contents/MacOS/Compacta" "$APP/Contents/Resources/ffmpeg/ffmpeg"; do
            archs=$(lipo -archs "$f")
            case "$archs" in *x86_64*) ;; *) echo "Falta la parte Intel en $f"; exit 1;; esac
            case "$archs" in *arm64*) ;; *) echo "Falta la parte Apple Silicon en $f"; exit 1;; esac
          done
          min=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")
          echo "macOS minimo declarado: $min"
          [ "$min" = "$MINIMO" ] || { echo "Se esperaba $MINIMO"; exit 1; }
          ls "$APP/Contents/Resources/app.asar.unpacked/node_modules/@img"
          # Avisos de permisos de macOS (Documentos, Escritorio, Descargas...): claves en Info.plist y textos de los 6 idiomas con sintaxis valida
          for key in NSDocumentsFolderUsageDescription NSDesktopFolderUsageDescription NSDownloadsFolderUsageDescription NSRemovableVolumesUsageDescription NSNetworkVolumesUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$APP/Contents/Info.plist" > /dev/null || { echo "Falta $key en Info.plist"; exit 1; }
          done
          n=0
          for f in "$APP"/Contents/Resources/*.lproj/InfoPlist.strings; do plutil -lint "$f"; n=$((n+1)); done
          [ "$n" = "6" ] || { echo "Se esperaban 6 InfoPlist.strings y hay $n"; exit 1; }

      - name: Lo mismo con la herramienta propia del proyecto (contrasta su lector de cabeceras con `lipo` en un Mac real)
        run: node scripts/mac-app-tools.js check "$APP"

      - name: Firma (sin ella Apple Silicon diria que la app esta «dañada»)
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier|Format" || true
          codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc" || { echo "Se esperaba firma ad-hoc"; exit 1; }
          # Esperado: Gatekeeper la rechaza por no estar notarizada (hay que abrirla una vez con «Abrir igualmente»).
          spctl --assess --type execute --verbose=2 "$APP" || echo "(esperado: sin notarizar)"

      - name: Comprimir de verdad con lo que lleva dentro la app (foto, HEIC, video, audio)
        run: |
          set -euo pipefail
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/Compacta" scripts/verify-packaged-engine.js "$APP/Contents/Resources"

      - name: Abrir la app de verdad y comprobar que la ventana carga
        run: |
          set -euo pipefail
          export COMPACTA_DEBUG=1 COMPACTA_SCREENSHOT="$RUNNER_TEMP/ventana.png"
          # --disable-gpu: el Mac Intel de GitHub es una maquina virtual SIN tarjeta grafica; sin esto Electron 44 no consigue iniciar la GPU
          # (EGL) y la captura de la ventana nunca termina. En un Mac de verdad hay GPU. Es lo mismo que se hace en las pruebas de Linux.
          "$APP/Contents/MacOS/Compacta" --disable-gpu > "$RUNNER_TEMP/app.log" 2>&1 &
          PID=$!
          for i in $(seq 1 90); do
            if grep -q "screenshot saved" "$RUNNER_TEMP/app.log" 2>/dev/null; then break; fi
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          cat "$RUNNER_TEMP/app.log"
          grep -q "did-finish-load" "$RUNNER_TEMP/app.log" || { echo "La ventana no cargo"; exit 1; }
          grep -q "screenshot saved" "$RUNNER_TEMP/app.log" || { echo "No se pudo capturar la ventana"; exit 1; }
          if grep -qi "DEBUG-renderer-crash\|DEBUG-did-fail-load\|uncaughtException" "$RUNNER_TEMP/app.log"; then echo "Hubo errores al abrir"; exit 1; fi

      - name: Guardar la captura de la ventana (para mirarla)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ventana-${{ matrix.variante }}-${{ matrix.os }}
          path: ${{ runner.temp }}/ventana.png
          if-no-files-found: ignore

      - name: Pruebas del proyecto en este Mac
        if: matrix.variante == 'moderno'
        shell: bash
        run: |
          set -o pipefail
          ps -axo pid,pcpu,etime,comm | sort -k2 -nr | head -12 > "${RUNNER_TEMP}/procesos.txt"; uptime >> "${RUNNER_TEMP}/procesos.txt"
          npm ci --no-audit --no-fund
          npm test 2>&1 | tee "${RUNNER_TEMP}/salida-pruebas.log"

      - name: Captura temporal de fallos (se retira en cuanto se identifique la causa)
        if: failure() && matrix.variante == 'moderno'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/ci"
          { echo "== $(sw_vers -productVersion) $(uname -m)"; echo "--- procesos al empezar las pruebas:"; cat "${RUNNER_TEMP}/procesos.txt"; grep -E "^# (tests|pass|fail|skipped)" "${RUNNER_TEMP}/salida-pruebas.log"; echo; grep -n -B1 -A45 "^not ok" "${RUNNER_TEMP}/salida-pruebas.log" | head -300; } > "${RUNNER_TEMP}/ci/captura.txt"
          cd "${RUNNER_TEMP}/ci"
          git init -q
          git checkout -q -b "captura-pruebas-${{ matrix.os }}"
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m captura
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "captura-pruebas-${{ matrix.os }}" || true

  # ------------------------------------------------------------------ 3. El instalador de Windows
  build-win:
    name: Instalador de Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Compilar el instalador de Windows
        run: npm run dist:win

      - name: Guardar el instalador
        uses: actions/upload-artifact@v7
        with:
          name: Compacta-Windows
          path: dist/*.exe
          if-no-files-found: error


  # ------------------------------------------------------------------ 4. Publicar (solo con etiqueta v*)
  release:
    name: Publicar en Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-mac, build-win]
    runs-on: ubuntu-24.04 # version fija: el alias «latest» de Ubuntu migra a la 26 y GitHub avisa de ello en cada ejecucion
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
          pattern: Compacta-*

      - run: ls -la release

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.dmg
            release/*.exe
          body: |
            ## Cual descargar

            - **Windows**: `Compacta.Setup.*.exe`.
            - **Mac con macOS 13 (Ventura) o mas nuevo** (Intel o chip Apple): `Compacta-*-Mac.dmg`. Es la version recomendada: lleva el mismo motor que la de Windows.
            - **Mac con macOS 10.13 a 12** (Macs antiguos): `Compacta-*-Mac-antiguo.dmg`. Lleva un motor mas antiguo para poder arrancar en esos sistemas: funciona, pero puede tener algun problema que la version normal no tiene. Tambien se puede usar en un Mac nuevo, pero no hace falta.

            Para saber que macOS tienes: menu  (manzana) → «Acerca de este Mac». Un Mac con macOS 10.12 o anterior no puede usar Compacta (se puede actualizar gratis a macOS 10.13 si el equipo es de finales de 2009 o posterior).
          generate_release_notes: true
