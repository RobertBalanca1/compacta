name: CAPTURA TEMPORAL - pruebas intermitentes en Macs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repetir:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Pasar la bateria 4 veces seguidas
        shell: bash
        run: |
          set +e
          for i in 1 2 3 4; do
            node --test tests/*.test.js > "${RUNNER_TEMP}/vuelta${i}.log" 2>&1
            code=$?
            echo "vuelta ${i}: salida=${code} $(grep -E '^# (tests|pass|fail|skipped)' "${RUNNER_TEMP}/vuelta${i}.log" | tr '\n' ' ') | carga: $(uptime | sed 's/.*load averages*: //')" >> "${RUNNER_TEMP}/resumen.txt"
          done
          cat "${RUNNER_TEMP}/resumen.txt"
          exit 0
      - name: Guardar el detalle en una rama
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "${RUNNER_TEMP}/ci"
          { echo "== ${{ matrix.os }} $(sw_vers -productVersion) $(uname -m)"; cat "${RUNNER_TEMP}/resumen.txt" 2>/dev/null; for i in 1 2 3 4; do f="${RUNNER_TEMP}/vuelta${i}.log"; if grep -qE "^ *not ok" "$f" 2>/dev/null; then echo; echo "===== VUELTA ${i}: detalle"; grep -n -B60 -A30 -E "^ *not ok" "$f" | head -450; fi; done; } > "${RUNNER_TEMP}/ci/captura.txt"
          cd "${RUNNER_TEMP}/ci"
          git init -q
          git checkout -q -b "captura-intermitentes-${{ matrix.os }}"
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m captura
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "captura-intermitentes-${{ matrix.os }}" || true
